name: deepsky_fra400
description: Catalogo deep sky, traiettorie nel cielo e controllo del flat panel WandererCover per Askar FRA400 e ASI2600MC Pro.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.8.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_ui: ^1.1.0
  flutter_blue_plus: ^2.3.0
  permission_handler: ^13.0.0
  camera: ^0.12.0
  geolocator: ^14.0.0
  http: ^1.2.0
  path_provider: ^2.1.0
  sensors_plus: ^7.0.0
  shared_preferences: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/catalog.json
