# Build manuale su Codemagic (quella automatica con pubblicazione per
# l'aggiornamento dall'app è in .github/workflows/release.yml).
# Build dell'APK su Codemagic. Fa gli stessi passi della build su GitHub Actions
# (.github/workflows/build.yml): genera la parte Android, aggiunge nome e
# permessi, firma sempre con la stessa chiave e compila.
workflows:
  android-release:
    name: Deep Sky FRA400 - APK
    max_build_duration: 60
    environment:
      flutter: 3.50.0
      java: 21
    scripts:
      - name: Genera il progetto Android
        script: |
          flutter create --platforms=android --org it.deepsky --project-name deepsky_fra400 .
          rm -f test/widget_test.dart
          python3 ci/patch_android.py

      # Stessa firma a ogni build, così gli aggiornamenti si installano sopra la versione precedente.
      - name: Firma fissa
        script: |
          mkdir -p "$HOME/.android"
          cp ci/debug.keystore "$HOME/.android/debug.keystore"

      - name: Scarica le librerie
        script: flutter pub get

      - name: Analisi del codice
        script: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test dei calcoli astronomici
        script: |
          flutter test || echo "Test non superati, la build continua"

      # Stessa numerazione della build su GitHub: 100 + numero di commit.
      - name: Compila l'APK
        script: |
          git fetch --unshallow 2>/dev/null || true
          COUNT=$(git rev-list --count HEAD)
          flutter build apk --release --build-number=$((100 + COUNT)) --build-name=1.2.$COUNT

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
